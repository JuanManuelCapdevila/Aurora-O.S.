# Rotación de la pantalla interna en grados (0, 90, 180, 270), aplicada por
# aurora-display al iniciar la sesión. La Win600 tiene el panel vertical de
# fábrica y montado de costado. La herramienta "Girar pantalla" guarda el
# valor elegido en /var/lib/aurora/display.conf, que tiene prioridad.
ROTATION=90
