# Rotación de la pantalla interna en grados (0, 90, 180, 270), aplicada por
# aurora-display al iniciar la sesión. La Win600 tiene el panel vertical de
# fábrica y montado de costado (270° confirmado en la consola). Para probar
# otro valor: `aurora-display set N` (se guarda en /var/lib/aurora/display.conf,
# que tiene prioridad).
ROTATION=270
