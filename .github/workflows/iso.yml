name: ISO

# Construye el ISO de Aurora, lo arranca en QEMU con la autoprueba y, en la rama
# principal, lo publica en el pre-release "dev" para descargarlo.

on:
  push:
    paths:
      - 'engine/**'
      - 'install/**'
      - 'iso/**'
      - 'rootfs/**'
      - 'theme/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests del motor
        run: cd engine && npm test
      - name: Validar el tema de ES-DE
        run: node theme/validate.mjs
      - name: ShellCheck
        run: |
          pip install --quiet shellcheck-py==0.11.0.1
          shellcheck --version
          shellcheck install/*.sh iso/build.sh iso/preview.sh rootfs/usr/local/bin/* \
            rootfs/usr/share/aurora/tools/*.sh iso/airootfs/usr/local/bin/*

  iso:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Construir el ISO (contenedor Arch Linux)
        run: |
          set -o pipefail
          docker run --rm --privileged -v "$PWD:/repo" -e OUT_DIR=/repo/out \
            archlinux:latest bash -c '/repo/iso/build.sh && { /repo/iso/preview.sh || echo "Las capturas fallaron (no bloquea el ISO)"; }' \
            2>&1 | tee build.log
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum ./*.iso > SHA256SUMS && ls -lh

      - name: Resumen del error de construcción
        if: failure()
        run: |
          # Las últimas líneas del log como anotación: se pueden leer por la API
          # aunque el log completo no esté accesible.
          [ -f build.log ] || exit 0
          # GitHub trunca cada anotación (~4 KB): se parte en bloques de 30 líneas
          # cortas, hasta 8 bloques (el máximo es 10 por paso).
          tail -n 240 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' | cut -c1-160 > tail.log
          split -l 30 tail.log chunk.
          for f in chunk.*; do
            echo "::error title=build.sh $f::$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
          done

      - name: Publicar capturas del tema (rama previews)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d out/preview ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" out
          cd out/preview
          git init -q -b previews
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews

      - name: Subir el ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iso
          path: out/
          retention-days: 7
          compression-level: 0

      - name: Autoprueba en QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 libarchive-tools
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            ACCEL="-enable-kvm -cpu host"
          else
            ACCEL=""
          fi
          ISO="$(ls out/*.iso)"
          LABEL="$(blkid -o value -s LABEL "$ISO")"
          mkdir -p qemu
          bsdtar -xf "$ISO" -C qemu arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          # shellcheck disable=SC2086
          timeout 25m qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -nographic -no-reboot \
            -cdrom "$ISO" \
            -kernel qemu/arch/boot/x86_64/vmlinuz-linux \
            -initrd qemu/arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$LABEL console=ttyS0 aurora.selftest systemd.unit=multi-user.target" \
            | tee qemu/serial.log || true
          grep 'AURORA-CHECK' qemu/serial.log || true
          if ! grep -q 'AURORA-SELFTEST: OK' qemu/serial.log; then
            report="$( (grep 'AURORA-CHECK' qemu/serial.log; echo '--- final del log ---'; tail -n 40 qemu/serial.log) \
              | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=autoprueba::$report"
            exit 1
          fi

      - name: Subir el log de QEMU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu/serial.log
          if-no-files-found: ignore

      - name: Publicar en el pre-release "dev"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --prerelease --title "Aurora (desarrollo)" \
              --notes "Última imagen construida desde la rama principal. Ver README para instalarla."
          # Reemplaza los archivos de la versión anterior.
          for asset in $(gh release view dev --json assets --jq '.assets[].name'); do
            gh release delete-asset dev "$asset" -y
          done
          gh release upload dev out/*.iso out/SHA256SUMS --clobber
