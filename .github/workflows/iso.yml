name: ISO

# Construye el ISO de Aurora, lo arranca en QEMU con la autoprueba y, en la rama
# principal, lo publica en el pre-release "dev" para descargarlo.

on:
  push:
    paths:
      - 'engine/**'
      - 'install/**'
      - 'iso/**'
      - 'rootfs/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del motor
        run: cd engine && npm test
      - name: ShellCheck
        run: |
          shellcheck install/*.sh iso/build.sh rootfs/usr/local/bin/* \
            rootfs/usr/share/aurora/tools/*.sh iso/airootfs/usr/local/bin/*

  iso:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Construir el ISO (contenedor Arch Linux)
        run: |
          docker run --rm --privileged -v "$PWD:/repo" -e OUT_DIR=/repo/out \
            archlinux:latest /repo/iso/build.sh
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum ./*.iso > SHA256SUMS && ls -lh

      - name: Subir el ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iso
          path: out/
          retention-days: 7
          compression-level: 0

      - name: Autoprueba en QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 libarchive-tools
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            ACCEL="-enable-kvm -cpu host"
          else
            ACCEL=""
          fi
          ISO="$(ls out/*.iso)"
          LABEL="$(blkid -o value -s LABEL "$ISO")"
          mkdir -p qemu
          bsdtar -xf "$ISO" -C qemu arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          # shellcheck disable=SC2086
          timeout 25m qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -nographic -no-reboot \
            -cdrom "$ISO" \
            -kernel qemu/arch/boot/x86_64/vmlinuz-linux \
            -initrd qemu/arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisolabel=$LABEL console=ttyS0 aurora.selftest systemd.unit=multi-user.target" \
            | tee qemu/serial.log || true
          grep 'AURORA-CHECK' qemu/serial.log || true
          grep -q 'AURORA-SELFTEST: OK' qemu/serial.log

      - name: Subir el log de QEMU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu/serial.log
          if-no-files-found: ignore

      - name: Publicar en el pre-release "dev"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --prerelease --title "Aurora (desarrollo)" \
              --notes "Última imagen construida desde la rama principal. Ver README para instalarla."
          # Reemplaza los archivos de la versión anterior.
          for asset in $(gh release view dev --json assets --jq '.assets[].name'); do
            gh release delete-asset dev "$asset" -y
          done
          gh release upload dev out/*.iso out/SHA256SUMS --clobber
