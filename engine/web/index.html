<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Aurora</title>
  <!-- Launcher provisorio (fase 2). Será reemplazado por el launcher en React. -->
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #7c5cff; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: var(--bg); color: var(--fg);
           font: 22px system-ui, sans-serif; display: flex; flex-direction: column; cursor: none; }
    header { padding: 20px 32px; font-size: 28px; font-weight: 700; letter-spacing: .05em; }
    ul { list-style: none; margin: 0; padding: 0 32px; flex: 1; overflow: hidden; }
    li { padding: 14px 20px; border-radius: 10px; display: flex; justify-content: space-between; }
    li.sel { background: var(--accent); }
    li small { color: var(--muted); }
    li.sel small { color: var(--fg); }
    footer { padding: 14px 32px; color: var(--muted); font-size: 16px; }
    .empty { padding: 32px; color: var(--muted); }
  </style>
</head>
<body>
  <header>AURORA</header>
  <ul id="list"></ul>
  <footer>A / Enter: jugar · ↑↓: mover · Select: apagar</footer>
  <script>
    const list = document.getElementById('list');
    let items = [];
    let sel = 0;
    let busy = false;

    function render() {
      list.innerHTML = '';
      if (!items.length) {
        list.innerHTML = '<li class="empty">No hay juegos. Agregalos con: aurora add &lt;carpeta&gt;</li>';
        return;
      }
      items.forEach((g, i) => {
        const li = document.createElement('li');
        li.className = i === sel ? 'sel' : '';
        li.innerHTML = `<span></span><small></small>`;
        li.children[0].textContent = g.name;
        li.children[1].textContent = [g.genre, g.api].filter(Boolean).join(' · ');
        list.appendChild(li);
      });
      list.children[sel]?.scrollIntoView({ block: 'nearest' });
    }

    async function post(url) {
      if (busy) return;
      busy = true;
      try {
        const res = await fetch(url, { method: 'POST' });
        if (!res.ok) throw new Error((await res.json()).error);
        document.body.style.opacity = '0.4';
      } catch (err) {
        alert(err.message);
        busy = false;
      }
    }

    function move(d) {
      if (!items.length) return;
      sel = (sel + d + items.length) % items.length;
      render();
    }
    const launch = () => items[sel] && post(`/api/launch/${items[sel].id}`);

    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') move(1);
      else if (e.key === 'ArrowUp') move(-1);
      else if (e.key === 'Enter') launch();
    });

    // Gamepad API: botones con mapeo "standard" (0 = A, 8 = Select, 12/13 = cruceta).
    const prev = {};
    function poll() {
      for (const pad of navigator.getGamepads()) {
        if (!pad) continue;
        const pressed = (i) => pad.buttons[i]?.pressed && !prev[`${pad.index}:${i}`];
        const axis = pad.axes[1] || 0;
        if (pressed(13) || (axis > 0.6 && !prev[`${pad.index}:ax`])) move(1);
        if (pressed(12) || (axis < -0.6 && !prev[`${pad.index}:ax`])) move(-1);
        if (pressed(0)) launch();
        if (pressed(8) && confirm('¿Apagar la consola?')) post('/api/system/poweroff');
        pad.buttons.forEach((b, i) => { prev[`${pad.index}:${i}`] = b.pressed; });
        prev[`${pad.index}:ax`] = Math.abs(axis) > 0.6;
      }
      requestAnimationFrame(poll);
    }

    fetch('/api/games').then((r) => r.json()).then((g) => { items = g; render(); });
    requestAnimationFrame(poll);
  </script>
</body>
</html>
